name: CD — 자동 배포

on:
  push:
    branches: [sprint1]

# Vercel 프론트엔드는 GitHub 연동 시 자동 배포되므로 별도 job 불필요
# 백엔드만 ghcr.io → Koyeb 파이프라인으로 처리

jobs:
  deploy-backend:
    name: Backend 빌드 & Koyeb 배포
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ghcr.io push 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 메타데이터 설정
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sidereport-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Backend Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Koyeb 재배포 트리거
        if: ${{ secrets.KOYEB_API_TOKEN != '' && secrets.KOYEB_BACKEND_SERVICE_ID != '' }}
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_BACKEND_SERVICE_ID }}
        run: |
          curl -s -X POST "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' -w "\nHTTP %{http_code}\n"
