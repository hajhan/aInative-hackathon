name: CD — 자동 배포

on:
  push:
    branches: [sprint1]

# Vercel 프론트엔드는 GitHub 연동 시 자동 배포되므로 별도 job 불필요
# 백엔드만 Fly.io로 배포

jobs:
  deploy-backend:
    name: Backend 배포 (Fly.io)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: flyctl 설치
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly.io 배포
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
